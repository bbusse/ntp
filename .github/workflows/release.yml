name: Build and Release Go Binaries

on:
  push:
    branches: [dev]
    tags:
      - 'rc-*'
      - 'release-*'
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-go-pkg-linux:
    uses: bbusse/github-workflows/.github/workflows/build-go-pkg-linux.yml@dev
    with:
      artifact_name: ntp

  build-go-pkg-freebsd:
    uses: bbusse/github-workflows/.github/workflows/build-go-pkg-freebsd.yml@dev
    with:
      artifact_name: ntp

  release:
    needs:
      - build-go-pkg-linux
      - build-go-pkg-freebsd
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: bbusse/github-workflows/.github/workflows/release.yml@dev
    with:
      artifact_name: ntp
      binary_name: ntp
      release_branch: dev
    secrets: inherit
